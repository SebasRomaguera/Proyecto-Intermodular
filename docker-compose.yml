services:
  backend:
    build:
      context: ./backend
    container_name: easytaxi-backend-local
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: easytaxi-frontend-local
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
