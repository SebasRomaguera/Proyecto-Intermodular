<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en EasyTaxi Palma">
  <title>Login - EasyTaxi Palma</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🚕 Easy<span>Taxi</span></h1>
      <p>Palma de Mallorca</p>
    </div>

    <h2>Iniciar sesión</h2>

    <div id="mensaje" class="mensaje hidden"></div>

    <form id="loginForm" aria-label="Formulario de inicio de sesión">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required
          aria-required="true"
          placeholder="tu@email.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required
          aria-required="true"
          placeholder="Tu contraseña"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" aria-label="Iniciar sesión">
        Entrar
      </button>
    </form>

    <div class="link-container">
      <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
