<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registro en EasyTaxi Palma - Solicita taxis en Palma de Mallorca">
  <title>Registro - EasyTaxi Palma</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🚕 Easy<span>Taxi</span></h1>
      <p>Palma de Mallorca</p>
    </div>

    <h2>Crear cuenta</h2>

    <div id="mensaje" class="mensaje hidden"></div>

    <form id="registerForm" aria-label="Formulario de registro">
      <div class="form-group">
        <label for="nombre">Nombre completo *</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          required
          aria-required="true"
          placeholder="Ej: Juan Pérez"
        >
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required
          aria-required="true"
          placeholder="tu@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required
          aria-required="true"
          minlength="6"
          placeholder="Mínimo 6 caracteres"
        >
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono (opcional)</label>
        <input 
          type="tel" 
          id="telefono" 
          name="telefono"
          placeholder="Ej: 666123456"
        >
      </div>

      <button type="submit" aria-label="Registrarse">
        Registrarse
      </button>
    </form>

    <div class="link-container">
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
