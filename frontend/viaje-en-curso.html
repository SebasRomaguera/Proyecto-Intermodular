<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje en Curso - EasyTaxi Palma</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #fff8df 0%, #f5f5f5 30%, #f5f5f5 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .viaje-container {
            max-width: 620px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .conductor-card {
            background: linear-gradient(135deg, #FDB913 0%, #FFA500 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(253, 185, 19, 0.18);
        }

        .conductor-nombre {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .conductor-valoracion {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .conductor-vehiculo {
            font-size: 18px;
            opacity: 0.95;
            margin: 5px 0;
        }

        .timeline {
            margin: 40px 0;
            position: relative;
        }

        .timeline-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }

        .timeline-point {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 2;
            background: white;
            border: 3px solid #ddd;
            color: #999;
        }

        .timeline-point.active {
            background: #FDB913;
            border-color: #FDB913;
            color: #000;
            box-shadow: 0 0 0 4px rgba(253, 185, 19, 0.22);
        }

        .timeline-point.completed {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .timeline-connector {
            flex: 1;
            height: 4px;
            background: #e5e7eb;
            margin: 0 10px;
        }

        .timeline-connector.completed {
            background: #10b981;
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6b7280;
            margin-top: 10px;
        }

        .timeline-label {
            flex: 1;
            text-align: center;
        }

        .timeline-label.active {
            color: #000;
            font-weight: bold;
        }

        .progress-bar {
            background: #e5e7eb;
            border-radius: 10px;
            height: 30px;
            margin: 30px 0;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #FDB913 0%, #FFA500 100%);
            height: 100%;
            transition: width 1s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            border-radius: 10px;
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #4b5563;
            z-index: 1;
        }

        .progress-text-white {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            z-index: 2;
            transition: clip-path 1s ease;
        }

        .tiempo-restante {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin: 20px 0;
        }

        .info-viaje {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 16px;
        }

        .info-item i {
            font-size: 24px;
            margin-right: 15px;
            color: #FDB913;
        }

        .precio-estimado {
            background: #fff4cf;
            color: #6b4b00;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-cancelar {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
        }

        .btn-cancelar:hover {
            background: #dc2626;
        }

        .estado-completado {
            background: #d1fae5;
            color: #065f46;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .estado-completado h2 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .valoracion-container {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .estrellas {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 40px;
            margin: 20px 0;
        }

        .estrella {
            cursor: pointer;
            color: #d1d5db;
            transition: color 0.2s;
        }

        .estrella:hover,
        .estrella.active {
            color: #FDB913;
        }

        .btn-valorar {
            background: #FDB913;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            box-shadow: 0 8px 18px rgba(253, 185, 19, 0.18);
            transition: all 0.25s ease;
        }

        .btn-valorar:hover {
            background: #FFA500;
            transform: translateY(-1px);
        }

        .language-option:hover {
            background: #f3f4f6;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            margin: 0;
        }

        .modal-message {
            text-align: center;
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-cancel {
            background: #f3f4f6;
            color: #4b5563;
        }

        .modal-btn-cancel:hover {
            background: #e5e7eb;
        }

        .modal-btn-confirm {
            background: #ef4444;
            color: white;
        }

        .modal-btn-confirm:hover {
            background: #dc2626;
        }

        .modal-btn-primary {
            background: #FDB913;
            color: #000;
        }

        .modal-btn-primary:hover {
            background: #FFA500;
        }

        .btn-home {
            background: #FDB913;
            color: #000;
            box-shadow: 0 8px 18px rgba(253, 185, 19, 0.18);
            transition: all 0.25s ease;
        }

        .btn-home:hover {
            background: #FFA500;
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }

            .viaje-container {
                margin: 10px auto;
                padding: 15px;
            }

            .conductor-nombre {
                font-size: 22px;
            }

            .conductor-valoracion {
                font-size: 16px;
            }

            .conductor-vehiculo {
                font-size: 15px;
            }

            .tiempo-restante {
                font-size: 20px;
            }

            .precio-estimado {
                font-size: 18px;
            }

            .estado-completado h2 {
                font-size: 22px;
            }

            .modal-buttons {
                flex-direction: column;
            }

            .modal-btn {
                width: 100%;
            }

            .timeline-labels {
                font-size: 11px;
            }

            .estrellas {
                font-size: 32px;
                gap: 6px;
            }

            .info-item {
                font-size: 14px;
            }

            .info-item i {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Modal de confirmación -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon" id="modal-icon">⚠️</div>
                <h3 class="modal-title" id="modal-title">Confirmar acción</h3>
            </div>
            <p class="modal-message" id="modal-message">¿Estás seguro?</p>
            <div class="modal-buttons" id="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" id="modal-confirm-btn">Confirmar</button>
            </div>
        </div>
    </div>
    <div class="viaje-container">
        <div id="contenido-viaje">
            <!-- Se llenará dinámicamente -->
        </div>
    </div>

    <script>
        // Traducciones
        const translations = {
            es: {
                timelineScheduled: 'Programado',
                timelineAssigned: 'Asignado',
                timelineOnWay: 'En camino',
                timelineArriving: 'Llegando',
                startsInMinute: 'Comienza en ~1 minuto',
                startsInMinutes: 'Comienza en ~{minutes} minutos',
                arriveInMinute: 'Llegará en ~1 minuto',
                arriveInMinutes: 'Llegará en ~{minutes} minutos',
                taxiArrived: '¡Tu taxi ha llegado!',
                origin: 'Origen',
                destination: 'Destino',
                estimatedPrice: 'Precio estimado',
                cancelTrip: 'Cancelar viaje',
                tripCompleted: '¡Viaje completado!',
                enjoyTrip: 'Esperamos que hayas disfrutado del viaje',
                rateExperience: '¿Cómo fue tu experiencia?',
                submitRating: 'Enviar valoración',
                thanks: '¡Gracias por tu valoración!',
                backHome: 'Volver al inicio',
                confirmCancel: '¿Estás seguro de que quieres cancelar este viaje?',
                tripCancelled: 'Viaje cancelado',
                redirecting: 'Redirigiendo...',
                selectRating: 'Por favor selecciona una valoración',
                errorLoadingTrip: 'Error al cargar el viaje',
                errorCancellingTrip: 'Error al cancelar el viaje',
                errorRating: 'Error al enviar la valoración'
            },
            en: {
                timelineScheduled: 'Scheduled',
                timelineAssigned: 'Assigned',
                timelineOnWay: 'On the way',
                timelineArriving: 'Arriving',
                startsInMinute: 'Starts in ~1 minute',
                startsInMinutes: 'Starts in ~{minutes} minutes',
                arriveInMinute: 'Arriving in ~1 minute',
                arriveInMinutes: 'Arriving in ~{minutes} minutes',
                taxiArrived: 'Your taxi has arrived!',
                origin: 'Origin',
                destination: 'Destination',
                estimatedPrice: 'Estimated price',
                cancelTrip: 'Cancel trip',
                tripCompleted: 'Trip completed!',
                enjoyTrip: 'We hope you enjoyed your trip',
                rateExperience: 'How was your experience?',
                submitRating: 'Submit rating',
                thanks: 'Thanks for your rating!',
                backHome: 'Back to home',
                confirmCancel: 'Are you sure you want to cancel this trip?',
                tripCancelled: 'Trip cancelled',
                redirecting: 'Redirecting...',
                selectRating: 'Please select a rating',
                errorLoadingTrip: 'Error loading trip',
                errorCancellingTrip: 'Error cancelling trip',
                errorRating: 'Error submitting rating'
            },
            ca: {
                timelineScheduled: 'Programat',
                timelineAssigned: 'Assignat',
                timelineOnWay: 'En camí',
                timelineArriving: 'Arribant',
                startsInMinute: 'Comenca en ~1 minut',
                startsInMinutes: 'Comenca en ~{minutes} minuts',
                arriveInMinute: 'Arribarà en ~1 minut',
                arriveInMinutes: 'Arribarà en ~{minutes} minuts',
                taxiArrived: 'El teu taxi ha arribat!',
                origin: 'Origen',
                destination: 'Destinació',
                estimatedPrice: 'Preu estimat',
                cancelTrip: 'Cancel·lar viatge',
                tripCompleted: 'Viatge completat!',
                enjoyTrip: 'Esperem que hagis gaudit del viatge',
                rateExperience: 'Com ha estat la teva experiència?',
                submitRating: 'Enviar valoració',
                thanks: 'Gràcies per la teva valoració!',
                backHome: 'Tornar a l\'inici',
                confirmCancel: 'Estàs segur que vols cancel·lar aquest viatge?',
                tripCancelled: 'Viatge cancel·lat',
                redirecting: 'Redirigint...',
                selectRating: 'Si us plau selecciona una valoració',
                errorLoadingTrip: 'Error al carregar el viatge',
                errorCancellingTrip: 'Error al cancel·lar el viatge',
                errorRating: 'Error al enviar la valoració'
            }
        };

        let currentLang = localStorage.getItem('language') || 'es';

        // Funciones del modal
        function showModal(icon, title, message, buttons) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            const modalButtons = document.getElementById('modal-buttons');
            modalButtons.innerHTML = '';
            
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = `modal-btn ${btn.class}`;
                button.textContent = btn.text;
                button.onclick = btn.onClick;
                modalButtons.appendChild(button);
            });
            
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function showConfirm(message, onConfirm) {
            const cancelText = currentLang === 'es' ? 'Cancelar' : (currentLang === 'en' ? 'Cancel' : 'Cancel·lar');
            const confirmText = currentLang === 'es' ? 'Confirmar' : (currentLang === 'en' ? 'Confirm' : 'Confirmar');
            
            showModal('⚠️', '', message, [
                { text: cancelText, class: 'modal-btn-cancel', onClick: closeModal },
                { text: confirmText, class: 'modal-btn-confirm', onClick: () => { closeModal(); onConfirm(); } }
            ]);
        }

        function showAlert(icon, title, message, buttonText = 'OK') {
            showModal(icon, title, message, [
                { text: buttonText, class: 'modal-btn-primary', onClick: closeModal }
            ]);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const viajeId = urlParams.get('id');
        let intervalId;
        let viajeCompletado = false;
        window.lastViajeData = null;

        if (!viajeId) {
            window.location.href = 'index.html';
        }

        // Función helper para obtener email del usuario
        function getUserEmail() {
            let userEmail = localStorage.getItem('userEmail');
            
            if (!userEmail) {
                const usuarioStr = localStorage.getItem('usuario');
                if (usuarioStr) {
                    const usuario = JSON.parse(usuarioStr);
                    userEmail = usuario.email;
                    localStorage.setItem('userEmail', userEmail);
                }
            }
            
            return userEmail;
        }

        async function obtenerEstadoViaje() {
            try {
                const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
            const response = await fetch(`${API_URL}/viajes/${viajeId}/estado`);
                const data = await response.json();

                if (data.success) {
                    window.lastViajeData = data.viaje;
                    mostrarViaje(data.viaje);
                    
                    if (data.viaje.estado === 'completado' && !viajeCompletado) {
                        viajeCompletado = true;
                        clearInterval(intervalId);
                        mostrarViajeCompletado(data.viaje);
                    }
                }
            } catch (error) {
                console.error('Error al obtener estado del viaje:', error);
            }
        }

        function mostrarViaje(viaje) {
            const t = translations[currentLang];
            const conductor = viaje.conductor;
            const progreso = viaje.progreso;
            const tiempoRestante = viaje.tiempoRestante;
            
            // Determinar estados de la timeline
            const estados = {
                programado: viaje.estado === 'programado',
                asignado: viaje.estado === 'asignado',
                en_camino: ['en_camino', 'llegando', 'completado'].includes(viaje.estado),
                llegando: ['llegando', 'completado'].includes(viaje.estado)
            };

            let tiempoTexto;
            if (viaje.estado === 'programado') {
                if (tiempoRestante === 1) {
                    tiempoTexto = t.startsInMinute;
                } else {
                    tiempoTexto = t.startsInMinutes.replace('{minutes}', tiempoRestante);
                }
            } else if (tiempoRestante > 0) {
                if (tiempoRestante === 1) {
                    tiempoTexto = t.arriveInMinute;
                } else {
                    tiempoTexto = t.arriveInMinutes.replace('{minutes}', tiempoRestante);
                }
            } else {
                tiempoTexto = t.taxiArrived;
            }

            const html = `
                <div class="conductor-card">
                    <div class="conductor-nombre">${conductor.nombre} ${conductor.apellidos}</div>
                    <div class="conductor-valoracion">⭐ ${conductor.valoracion}</div>
                    <div class="conductor-vehiculo">${conductor.vehiculo.marca} ${conductor.vehiculo.modelo}</div>
                    <div class="conductor-vehiculo">${conductor.vehiculo.color} • ${conductor.vehiculo.matricula}</div>
                    <div class="conductor-vehiculo" style="margin-top: 10px;">
                        <i class="ph ph-phone"></i> ${conductor.telefono}
                    </div>
                </div>

                <div class="timeline">
                    <div class="timeline-line">
                        <div class="timeline-point ${estados.programado || estados.asignado ? 'active' : 'completed'}">
                            <i class="ph-fill ph-check-circle"></i>
                        </div>
                        <div class="timeline-connector ${estados.en_camino ? 'completed' : ''}"></div>
                        <div class="timeline-point ${estados.en_camino && !estados.llegando ? 'active' : estados.llegando ? 'completed' : ''}">
                            <i class="ph-fill ph-car"></i>
                        </div>
                        <div class="timeline-connector ${estados.llegando ? 'completed' : ''}"></div>
                        <div class="timeline-point ${estados.llegando ? 'active' : ''}">
                            <i class="ph-fill ph-map-pin"></i>
                        </div>
                    </div>
                    <div class="timeline-labels">
                        <div class="timeline-label ${estados.programado || estados.asignado ? 'active' : ''}">${estados.programado ? t.timelineScheduled : t.timelineAssigned}</div>
                        <div class="timeline-label ${estados.en_camino && !estados.llegando ? 'active' : ''}">${t.timelineOnWay}</div>
                        <div class="timeline-label ${estados.llegando ? 'active' : ''}">${t.timelineArriving}</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progreso}%"></div>
                    <div class="progress-text">${progreso}%</div>
                    <div class="progress-text-white" style="clip-path: inset(0 ${100-progreso}% 0 0);">${progreso}%</div>
                </div>

                ${tiempoRestante > 0 ? `
                    <div class="tiempo-restante">
                        <i class="ph ph-clock"></i> 
                        ${tiempoTexto}
                    </div>
                ` : `
                    <div class="tiempo-restante" style="color: #10b981;">
                        <i class="ph-fill ph-check-circle"></i> ${tiempoTexto}
                    </div>
                `}

                <div class="info-viaje">
                    <div class="info-item">
                        <i class="ph-fill ph-map-pin"></i>
                        <div>
                            <strong>${t.origin}:</strong><br>
                            ${viaje.origen}
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="ph-fill ph-flag"></i>
                        <div>
                            <strong>${t.destination}:</strong><br>
                            ${viaje.destino}
                        </div>
                    </div>
                </div>

                <div class="precio-estimado">
                    💰 ${t.estimatedPrice}: ${viaje.precioEstimado}€
                </div>

                ${viaje.estado !== 'completado' ? `
                    <button class="btn-cancelar" onclick="cancelarViaje()">
                        <i class="ph ph-x-circle"></i> ${t.cancelTrip}
                    </button>
                ` : ''}
            `;

            document.getElementById('contenido-viaje').innerHTML = html;
        }

        function mostrarViajeCompletado(viaje) {
            const t = translations[currentLang];
            const html = `
                <div class="estado-completado">
                    <h2>🎉 ${t.tripCompleted}</h2>
                    <p>${t.enjoyTrip}</p>
                </div>

                <div class="valoracion-container">
                    <h3 style="text-align: center; margin-bottom: 20px;">${t.rateExperience}</h3>
                    <div class="estrellas" id="estrellas">
                        <span class="estrella" data-valor="1">★</span>
                        <span class="estrella" data-valor="2">★</span>
                        <span class="estrella" data-valor="3">★</span>
                        <span class="estrella" data-valor="4">★</span>
                        <span class="estrella" data-valor="5">★</span>
                    </div>
                    <button class="btn-valorar" onclick="enviarValoracion()" id="btn-valorar" disabled>
                        ${t.submitRating}
                    </button>
                </div>

                <button class="btn-home" style="margin-top: 20px;" onclick="window.location.href='index.html'">
                    <i class="ph ph-house"></i> ${t.backHome}
                </button>
            `;

            document.getElementById('contenido-viaje').innerHTML = html;

            // Sistema de valoración con estrellas
            let valoracionSeleccionada = 0;
            const estrellas = document.querySelectorAll('.estrella');
            
            estrellas.forEach(estrella => {
                estrella.addEventListener('click', function() {
                    valoracionSeleccionada = parseInt(this.dataset.valor);
                    actualizarEstrellas(valoracionSeleccionada);
                    document.getElementById('btn-valorar').disabled = false;
                });
                
                estrella.addEventListener('mouseenter', function() {
                    const valor = parseInt(this.dataset.valor);
                    actualizarEstrellas(valor);
                });
            });
            
            document.getElementById('estrellas').addEventListener('mouseleave', function() {
                actualizarEstrellas(valoracionSeleccionada);
            });
            
            function actualizarEstrellas(valor) {
                estrellas.forEach((estrella, index) => {
                    if (index < valor) {
                        estrella.classList.add('active');
                    } else {
                        estrella.classList.remove('active');
                    }
                });
            }
            
            window.valoracionSeleccionada = valoracionSeleccionada;
            window.actualizarEstrellas = actualizarEstrellas;
        }

        function cancelarViaje() {
            const t = translations[currentLang];
            showConfirm(t.confirmCancel, async () => {
                try {
                    const userEmail = getUserEmail();
                    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
       const response = await fetch(`${API_URL}/viajes/${viajeId}/cancelar`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-user-email': userEmail
                        }
                    });

                    const data = await response.json();

                    if (data.success) {
                        const okText = currentLang === 'en' ? 'OK' : 'Aceptar';
                        showAlert('✅', t.tripCancelled, t.redirecting, okText);
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        showAlert('❌', 'Error', data.mensaje, 'OK');
                    }
                } catch (error) {
                    console.error('Error al cancelar viaje:', error);
                    showAlert('❌', 'Error', t.errorCancellingTrip, 'OK');
                }
            });
        }

        async function enviarValoracion() {
            const t = translations[currentLang];
            const valoracion = window.valoracionSeleccionada;
            
            if (valoracion === 0) {
                showAlert('⭐', '', t.selectRating, 'OK');
                return;
            }

            try {
                const userEmail = getUserEmail();
                const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
   const response = await fetch(`${API_URL}/viajes/${viajeId}/valorar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': userEmail
                    },
                    body: JSON.stringify({ valoracion })
                });

                const data = await response.json();

                if (data.success) {
                    const okText = currentLang === 'en' ? 'OK' : 'Aceptar';
                    showAlert('🎉', t.thanks, t.redirecting, okText);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert('❌', 'Error', data.mensaje, 'OK');
                }
            } catch (error) {
                console.error('Error al valorar viaje:', error);
                showAlert('❌', 'Error', t.errorRating, 'OK');
            }
        }

        // Iniciar polling
        obtenerEstadoViaje();
        intervalId = setInterval(obtenerEstadoViaje, 3000); // Actualizar cada 3 segundos

        // Cerrar modal al hacer clic fuera
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') {
                closeModal();
            }
        });
    </script>
</body>
</html>
